<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنتجات | عزوز للإلكترونيات</title>
  <meta name="description" content="تصفح جميع منتجات عزوز للإلكترونيات – ملفات سماعات، أمبليفاير، ترانزستورات، بطاريات ليثيوم وأكثر.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .products-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4rem; }
    .products-grid-4 { grid-template-columns: repeat(4, 1fr); }
    .products-grid-3 { grid-template-columns: repeat(3, 1fr); }
    .products-grid-2 { grid-template-columns: repeat(2, 1fr); }
    @media (max-width: 900px) { .products-grid, .products-grid-4, .products-grid-3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px) { .products-grid, .products-grid-4, .products-grid-3, .products-grid-2 { grid-template-columns: 1fr 1fr; } }

    .mobile-filter-btn {
      display: none;
      padding: 0.6rem 1.2rem;
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-full);
      color: var(--gold);
      background: var(--gold-muted);
      font-size: 0.88rem;
      font-weight: 600;
    }

    @media (max-width: 1024px) {
      .mobile-filter-btn { display: flex; align-items: center; gap: 0.4rem; }
      .sidebar { display: none; }
      .sidebar.open { display: block; }
      .products-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-page="products">

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar">
    <div class="container">
      <div class="nav-inner">
        <a href="index.html" class="nav-logo">
          <img src="imgs/logo.jpg" alt="عزوز للإلكترونيات" class="logo-img" style="width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid var(--gold-border);box-shadow:0 0 12px var(--gold-glow)">
          <div class="logo-text">
            <span class="logo-main">عزوز للإلكترونيات</span>
            <span class="logo-sub">منذ عام 1992</span>
          </div>
        </a>

        <div class="nav-search">
          <input type="text" placeholder="ابحث عن منتج..." id="search-input">
          <span class="search-icon">🔍</span>
          <div class="search-dropdown"></div>
        </div>

        <div class="nav-links">
          <a href="index.html" class="nav-link">الرئيسية</a>
          <a href="products.html" class="nav-link active">المنتجات</a>
          <a href="index.html#about" class="nav-link">من نحن</a>
        </div>

        <div class="nav-actions">
          <a href="cart.html" class="nav-btn" title="السلة">
            🛒<span class="cart-count" style="display:none">0</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- ===== PAGE HERO ===== -->
  <div class="page-hero">
    <div class="container">
      <div class="breadcrumb">
        <a href="index.html">الرئيسية</a>
        <span>←</span>
        <span>جميع المنتجات</span>
      </div>
      <h1 class="section-title">جميع المنتجات</h1>
      <p class="section-subtitle">+38 منتج إلكتروني بجودة مضمونة</p>
    </div>
  </div>

  <!-- ===== PRODUCTS LAYOUT ===== -->
  <div class="container">
    <div class="products-layout">

      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-title">📁 التصنيفات</div>
          <div class="sidebar-list" id="sidebar-categories"></div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-title">💰 نطاق السعر</div>
          <div class="price-range-wrap">
            <input type="range" class="price-slider" id="price-slider" min="5" max="500" value="500" step="5">
            <div class="price-labels">
              <span>5 ج</span>
              <span id="price-max">500 ج</span>
            </div>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-title">🔃 ترتيب حسب</div>
          <select class="sort-select" id="sort-select">
            <option value="default">الافتراضي</option>
            <option value="price-asc">السعر: الأقل أولاً</option>
            <option value="price-desc">السعر: الأعلى أولاً</option>
            <option value="rating">التقييم</option>
            <option value="newest">الأحدث</option>
          </select>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main>
        <div class="products-page-header">
          <div style="display:flex;gap:0.8rem;align-items:center">
            <button class="mobile-filter-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">
              ⚙️ الفلاتر
            </button>
            <span class="products-count" id="products-count">38 منتج</span>
          </div>
          <div class="view-toggle">
            <button class="view-btn active" data-view="grid-3" title="عرض 3 أعمدة">⊞</button>
            <button class="view-btn" data-view="grid-4" title="عرض 4 أعمدة">⊟</button>
            <button class="view-btn" data-view="grid-2" title="عرض أعمدتين">▤</button>
          </div>
        </div>

        <!-- Quick filter tabs -->
        <div class="filter-tabs" style="margin-bottom:1.5rem;flex-wrap:wrap">
          <button class="filter-tab active" data-cat="all" onclick="filterByCategory('all')">الكل</button>
          <button class="filter-tab" data-cat="speakers" onclick="filterByCategory('speakers')">🔊 سماعات</button>
          <button class="filter-tab" data-cat="amplifier" onclick="filterByCategory('amplifier')">📡 أمبليفاير</button>
          <button class="filter-tab" data-cat="transistor" onclick="filterByCategory('transistor')">⚡ ترانزستورات</button>
          <button class="filter-tab" data-cat="ic" onclick="filterByCategory('ic')">💡 ICs</button>
          <button class="filter-tab" data-cat="battery" onclick="filterByCategory('battery')">🔋 بطاريات</button>
          <button class="filter-tab" data-cat="charging" onclick="filterByCategory('charging')">🛡️ شحن وحماية</button>
          <button class="filter-tab" data-cat="car" onclick="filterByCategory('car')">🚗 سيارة</button>
          <button class="filter-tab" data-cat="adapter" onclick="filterByCategory('adapter')">🔌 أدابترات</button>
        </div>

        <div class="products-grid products-grid-3" id="products-grid"></div>
      </main>
    </div>
  </div>

  <!-- ===== CHATBOT ===== -->
  <button class="chatbot-toggle" id="chatbot-toggle" title="مساعد عزوز الذكي">🤖</button>
  <div class="chatbot-window" id="chatbot-window">
    <div class="chatbot-header">
      <div class="chatbot-header-info">
        <div class="chatbot-avatar">🤖<div class="chatbot-online"></div></div>
        <div>
          <div class="chatbot-name">مساعد عزوز الذكي</div>
          <div class="chatbot-status">● متصل الآن</div>
        </div>
      </div>
      <button class="chatbot-close" id="chatbot-close">✕</button>
    </div>
    <div class="chatbot-messages" id="chatbot-messages"></div>
    <div class="chatbot-input-wrap">
      <input type="text" class="chatbot-input" id="chatbot-input" placeholder="اسألني عن أي منتج...">
      <button class="chatbot-send" id="chatbot-send">➤</button>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
